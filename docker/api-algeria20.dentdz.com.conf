# ==============================================================================
# CASEFILE 404 — Production Host Nginx Reverse Proxy
# Subdomain: api-algeria20.dentdz.com
# Proxy Target: Docker Container on 127.0.0.1:8080
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api-algeria20.dentdz.com;

    # Certbot challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 30M;

    # Reverse proxy to Laravel Docker container
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for interactive workshop challenges
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
