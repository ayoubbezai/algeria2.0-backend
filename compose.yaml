
name: ${APP_NAME}_${APP_ENV}

services:
  app:
    container_name: ${APP_NAME}_${APP_ENV}_app
    build:
      context: .
      target: app
      args:
        APP_ENV: ${APP_ENV}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: ${APP_NAME}_${APP_ENV}_web
    image: nginx:alpine
    ports:
      - "127.0.0.1:${APP_WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    container_name: ${APP_NAME}_${APP_ENV}_db
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-casefile404}
      MYSQL_USER: ${DB_USERNAME:-casefile_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-casefile_db_pass_2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-casefile_root_pass_2026!}
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    container_name: ${APP_NAME}_${APP_ENV}_redis
    image: redis:7-alpine
    restart: unless-stopped

  phpmyadmin:
    container_name: ${APP_NAME}_${APP_ENV}_phpmyadmin
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  vendor:
